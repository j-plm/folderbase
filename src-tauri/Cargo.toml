[package]
name = "folderbase"
version = "0.1.0"
description = "Folderbase — local file management with virtual folder views"
authors = []
edition = "2021"

[lib]
name = "folderbase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
mime_guess = "2"
kamadak-exif = "0.5"
opener = "0.7"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSHapticFeedback", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSFontDescriptor", "objc2-core-graphics", "objc2-core-foundation"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
